name: Build Release (wheel + bundle)

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # wichtig für setuptools_scm (Tags!)
          
      - name: Fetch tags
          run: git fetch --tags --force

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Copy frontend dist into backend/static
        run: |
          rm -rf backend/static
          mkdir -p backend/static
          cp -r frontend/dist/* backend/static/

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build wheel
        run: |
          python -m pip install -U pip build
          python -m build

      - name: Assemble release bundle
        run: |
          mkdir -p release/wheels
          cp dist/*.whl release/wheels/
          cp deploy/run.sh release/
          cp deploy/run.ps1 release/
          cp deploy/.env.example release/
          cp deploy/README-Run.md release/
          mkdir -p release/systemd
          cp deploy/systemd/central-upstream.service release/systemd/
          (cd release && zip -r ../release_bundle.zip .)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            release_bundle.zip
